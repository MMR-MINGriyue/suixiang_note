name: suixiang_note
description: "随想随记 — 本地优先的轻量灵感管理 App（Windows 桌面先行）"
publish_to: 'none'
version: 1.4.2+6

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 数据层：drift + sqlite3（本地优先，无云同步）
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 备份/恢复数据级测试：path_provider 测试桩
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  # drift 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/texture/
    - assets/illus/
